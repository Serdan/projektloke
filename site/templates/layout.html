<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#indhold">Spring til indhold</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="{{siteTitle}} – forside">
        <img class="brand-mark" src="/assets/brand/mark.svg" width="12" height="32" alt="" aria-hidden="true">
        <span>{{siteTitle}}</span>
      </a>
      <nav class="primary-nav" aria-label="Primær navigation">
        {{navigation}}
      </nav>
    </div>
  </header>

  <main id="indhold">
    {{content}}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p><strong>{{siteTitle}}</strong> dokumenterer udviklingen i fordomme og fjendtlighed mod minoriteter i Danmark med særligt fokus på transfobi.</p>
      <p class="footer-meta">© {{year}} · Kilder først · Rettelser dokumenteres</p>
    </div>
  </footer>
</body>
</html>
